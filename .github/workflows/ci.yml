name: CI

on:
  push:
    branches: [main, development]
  pull_request:

env:
  # Pinned OPA CLI release (D-06). The exact version is fixed so the WASM bundles
  # the test fixtures compile (tests/_opa.py builds the test constitutions at
  # session start) are reproducible.
  OPA_VERSION: "1.9.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Install pinned OPA CLI
        # Load-bearing for pytest: tests/_opa.py finds OPA on PATH and compiles
        # the test constitutions (the D-04 with/without-principle WASM pair) at
        # session start. Without it those tests skip instead of gating.
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: OPA policy tests
        run: |
          # Hand-written Rego is gone (the constitution compiler's golden/behavioral
          # tests cover policy logic now); guard stays in case .rego returns.
          if compgen -G "policies/*.rego" > /dev/null; then
            opa test policies/
          else
            echo "policies/ has no hand-written .rego — policy logic is covered by the constitution compiler tests."
          fi

      - name: Pytest
        run: uv run pytest -q

      - name: Regression-lock gate
        # Hard-fail gate: any regression_lock test failing breaks the build.
        # Meaningful once the D-04 red-team test lands in plan 01-06.
        run: uv run pytest -m regression_lock --maxfail=1

      - name: Detector determinism check
        # Re-runs detector unit tests 100x to prove the verdict is non-flaky.
        # Meaningful once the SEC-01 detector tests land in plan 01-03.
        run: uv run pytest tests/unit -k detector --count=100 -q
