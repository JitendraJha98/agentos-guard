name: CI

on:
  push:
    branches: [main, development]
  pull_request:

env:
  # Pinned OPA CLI release (D-06). The exact version is fixed so the WASM bundles
  # the test fixtures compile (tests/_opa.py builds the test constitutions at
  # session start) are reproducible.
  OPA_VERSION: "1.9.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Install pinned OPA CLI
        # Load-bearing for pytest: tests/_opa.py finds OPA on PATH and compiles
        # the test constitutions (the D-04 with/without-principle WASM pair) at
        # session start. Without it those tests skip instead of gating.
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: OPA policy tests
        run: |
          # Hand-written Rego is gone (the constitution compiler's golden/behavioral
          # tests cover policy logic now); guard stays in case .rego returns.
          if compgen -G "policies/*.rego" > /dev/null; then
            opa test policies/
          else
            echo "policies/ has no hand-written .rego — policy logic is covered by the constitution compiler tests."
          fi

      - name: Pytest
        run: uv run pytest -q

      - name: Regression-lock gate
        # Hard-fail gate: any regression_lock test failing breaks the build.
        # Meaningful once the D-04 red-team test lands in plan 01-06.
        run: uv run pytest -m regression_lock --maxfail=1

      - name: Detector determinism check
        # Re-runs detector unit tests 100x to prove the verdict is non-flaky.
        # Meaningful once the SEC-01 detector tests land in plan 01-03.
        run: uv run pytest tests/unit -k detector --count=100 -q

  redteam:
    # Dedicated garak + PyRIT red-team gate (TEST-02/06). The heavy ML deps (garak/pyrit ->
    # torch/transformers/datasets) and the longer statistical run are isolated in this job so
    # the `test` job above stays lean and deterministic (its `pytest -q` never imports them —
    # tests/redteam/test_garak_pyrit_gate.py importorskips the extra). Hard-fails the build on
    # an ASR-ceiling breach, i.e. a governance regression that lets materially more attacks
    # through (TEST-06 — "safety as a failing test").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pinned OPA CLI
        # The governed pipeline compiles the test constitution at session start (tests/_opa.py
        # finds OPA on PATH) — the same requirement as the `test` job.
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: Sync workspace + redteam extra
        # Installs garak + pyrit (the optional `redteam` dependency group) alongside the
        # workspace packages and the default dev group (pytest).
        run: uv sync --all-packages --group redteam

      - name: garak + PyRIT ASR gate
        # Hard-fail gate: an ASR breach past the calibrated ceiling breaks the build (TEST-06).
        run: uv run pytest tests/redteam/test_garak_pyrit_gate.py -q
