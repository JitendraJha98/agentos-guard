[project]
name = "agentos-guard"
version = "0.1.0"
description = "Governance and security control plane for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jitendra Jha" },
    { name = "Siddhant Nikumbh" },
]
keywords = [
    "ai", "agents", "agent-governance", "ai-safety", "security",
    "policy", "opa", "audit", "llm", "guardrails",
]
# Development Status 3 (Alpha), not 4 (Beta): this is the first published release and the API
# has never been depended on from outside this repo. A large test suite is not the same as a
# proven interface, and this classifier is what an adopter reads to decide how much to trust
# the version number.
# No "License :: OSI Approved" classifier: PEP 639 forbids pairing one with a `license`
# expression. No "Typing :: Typed" either -- there is no py.typed marker, so it would claim
# something not actually shipped.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.13,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "PyJWT>=2.13",
    "cryptography>=48",
    "rfc3161-client>=1.0.3",
    "anthropic>=0.92",
    "openai>=1.40,<3",
    "fastapi>=0.115",
    "agentos-guard-constitution==0.1.0",
    "agentos-guard-contract==0.1.0",
    "agentos-guard-controlplane==0.1.0",
    "agentos-guard-gateway==0.1.0",
    "agentos-guard-pipeline==0.1.0",
    "agentos-guard-sdk==0.1.0",
]

[project.urls]
Homepage = "https://github.com/JitendraJha98/agentos-guard"
Repository = "https://github.com/JitendraJha98/agentos-guard"
Issues = "https://github.com/JitendraJha98/agentos-guard/issues"
Documentation = "https://github.com/JitendraJha98/agentos-guard/tree/main/docs/architecture"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-repeat",
    "pytest-benchmark",
    "httpx>=0.27",
]
# Slice 6e (TEST-02/06): heavy ML red-team libraries — garak + PyRIT — bound to the
# governed agent via packages/sdk/src/agentos_sdk/redteam_external.py. Pinned for
# reproducibility. Isolated to this OPTIONAL group so the main deterministic `pytest`
# suite never imports them; the live gate (tests/redteam/test_garak_pyrit_gate.py)
# importorskips them, and the dedicated CI `redteam` job installs them via
# `uv sync --group redteam`.
# Pins discovered by resolving the two libraries together (Slice 6e Task 1):
# garak 0.15.1 (latest) needs openai>=2,<3 + datasets>=3,<4; pyrit 0.14.0 needs
# datasets>=4.8 which is IRRECONCILABLE with garak, so pyrit is held at 0.13.0
# (datasets 3.x) — the newest pyrit that co-installs with the newest garak. Both
# need openai>=2, which is why the root openai bound was widened to <3.
redteam = [
    "garak==0.15.1",
    "pyrit==0.13.0",
]
# Slice 10b (INT-08): the OpenAI Agents SDK, used ONLY by the second framework adapter
# (packages/sdk/src/agentos_sdk/adapters/openai_agents.py) and its tests. OPTIONAL so the
# base install stays lean and adopters of one framework never pay for the other; the
# adapter imports it lazily and both test modules `importorskip("agents")`.
# Install alongside the other groups — a bare `uv sync --all-packages` PRUNES them:
#   uv sync --all-packages --group dev --group redteam --group adapters
# Upper bound 0.21: openai-agents 0.21.0 moved to `openai>=3,<4`, which is IRRECONCILABLE
# with garak==0.15.1's `openai>=2,<3` (the same class of conflict that pinned pyrit to
# 0.13.0). 0.20.0 is the newest release that co-installs with the redteam group.
adapters = [
    "openai-agents>=0.20,<0.21",
    # A TRANSITIVE constraint, not a dependency we use: openai-agents pulls `mcp`, and mcp 2.x
    # requires `httpx2`. starlette's TestClient PREFERS httpx2 whenever it is installed, so its
    # responses stop being instances of the httpx 0.28 types every client in this repo is built
    # on — 8 control-plane-client tests fail on `isinstance(response.stream, SyncByteStream)`.
    # openai-agents accepts mcp>=1.19,<3, so holding it at 1.x keeps one HTTP stack in the venv.
    "mcp>=1.19,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Metadata-only: the umbrella ships no modules, it just pulls in the six real packages.
[tool.hatch.build.targets.wheel]
bypass-selection = true

# uv workspace: each package under packages/ has its own pyproject.toml and
# shares this single lockfile. The `contract` package (PIPE-07 / D-08) is the
# stable boundary with zero internal dependencies and is built first.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agentos-guard-constitution = { workspace = true }
agentos-guard-contract = { workspace = true }
agentos-guard-controlplane = { workspace = true }
agentos-guard-gateway = { workspace = true }
agentos-guard-pipeline = { workspace = true }
agentos-guard-sdk = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath unnecessary: workspace packages are installed editable by `uv sync`.
markers = [
    "regression_lock: safety-regression locks that hard-fail CI (D-04 proof-of-life).",
    "floor_invariant: asserts risk/trust never relax the deterministic policy floor.",
    "latency: hot-path latency assertions (informational in Phase 1, gated in Phase 3).",
]
