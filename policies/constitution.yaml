# The example operator Constitution (POL-01) — copy this file and edit.
#
# Numbered principles with verbatim statements; the compiler lowers this file
# deterministically to YAML policy + Rego (POL-02). Principles 1.1/2.1/3.2/3.5
# are the Phase-3 wedge (PII egress + rename_then_drop); 4.1 shows the
# non-blocking governance_review effect (POL-14). `temporary_exception` is
# never authorable here (POL-13) — it is human-ratified at runtime only.
schema_version: 1
name: agentos-guard-example
lists:
  egress_allowlist: [api.example.com]
graduated:
  default: {sandbox_at: 0.4, deny_at: 0.7, trust_harden_at: 0.2}
principles:
  - id: "1.1"
    title: Egress allowlist
    statement: An agent may only make outbound requests to allowlisted hosts.
    applies_to: [tool_call]
    effect: deny
    when: {field: egress.host, op: not_in, list_ref: egress_allowlist}
    remediation:
      - Add the destination host to the egress_allowlist list and re-apply the constitution.
  - id: "2.1"
    title: Destructive or exfiltrating intent requires approval
    statement: Destructive or exfiltrating actions require human approval.
    effect: require_approval
    when:
      any:
        - {field: intent.class, op: eq, value: DATA_DESTRUCTION}
        - {field: intent.class, op: eq, value: DATA_EXFILTRATION}
  - id: "3.2"
    title: PII never leaves approved hosts
    statement: An agent must never send user PII to a host outside the approved allowlist.
    applies_to: [tool_call, mcp_call]
    effect: deny
    when:
      all:
        - {field: guardrails.pii, op: eq, value: true}
        - {field: egress.host, op: not_in, list_ref: egress_allowlist}
    remediation:
      - Strip or redact the PII from the payload, or send to an approved host.
      - Add the destination host to the egress_allowlist if it is trusted with PII.
  - id: "3.5"
    title: Rename-then-drop is forbidden
    statement: A rename followed by destruction of the renamed resource is forbidden, even when each step looks benign alone.
    kind: sequence
    sequence: [RESOURCE_RENAME, DATA_DESTRUCTION]
    effect: deny
    remediation:
      - "Request an operator-approved temporary exception, or perform the rename and destruction as separately approved operations."
  - id: "4.1"
    title: External sends proceed under governance review
    statement: Outbound communication to approved hosts proceeds, but is opened for asynchronous governance review.
    applies_to: [tool_call]
    effect: governance_review
    when: {field: egress.host, op: in, list_ref: egress_allowlist}
    side_effects: [notify]
  # ECON-02: spend is governed by the SAME engine as everything else. There is no budget enforcer
  # running beside the pipeline — these two principles are the whole of it, and deleting them
  # deletes the fleet's spend gate. The ratio is 0.0 for an agent with no configured budget, so
  # these never fire in a deployment that has not opted in.
  - id: "5.1"
    title: Spending beyond budget requires approval
    statement: An agent that has consumed its budget may not continue spending without human approval.
    effect: require_approval
    # require_approval rather than deny: a hard stop on a budget boundary strands work that may be
    # one call from completing, with no way forward but an operator editing policy. Approval keeps a
    # human in the loop and records WHO authorized the overspend. An operator who wants a hard stop
    # changes one word here — which is the point of expressing this as policy. Note what that word
    # also changes: POL-13 temporary exceptions apply only to a DENY floor, so `require_approval`
    # here is unwaivable, while `deny` brings the budget floor within reach of a human-ratified
    # exception. Both are consistent; the second is a different, deliberate trade.
    when: {field: cost.budget_used_ratio, op: gte, value: 1.0}
    remediation:
      - Raise the agent's budget, or approve this action explicitly.
      - Investigate why the agent consumed its budget — a runaway loop spends faster than a task.
  - id: "5.2"
    title: Approaching budget proceeds under governance review
    statement: An agent that has consumed most of its budget proceeds, but is opened for asynchronous governance review.
    effect: governance_review
    when: {field: cost.budget_used_ratio, op: gte, value: 0.8}
