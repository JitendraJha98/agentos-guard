[project]
name = "agentos-contract"
version = "0.1.0"
description = "Stable, serializable contract package (AgentAction, Decision, RiskFinding) — the integration seam every PEP form plugs into. Zero internal dependencies (D-08 / PIPE-07)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos_contract"]
