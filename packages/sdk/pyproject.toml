[project]
name = "agentos-guard-sdk"
version = "0.1.0"
description = "The data-plane PEP (INT-01/SDK-01): a LangChain v1 AgentMiddleware that intercepts tool calls, normalizes them to AgentAction, and enforces the pipeline decision (allow runs the tool; deny short-circuits by NOT calling the handler). Depends ONLY on agentos-guard-contract + agentos-guard-pipeline — PEP logic never leaks into the PDP (Anti-Pattern 5)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jitendra Jha" },
    { name = "Siddhant Nikumbh" },
]
keywords = [
    "ai", "agents", "agent-governance", "ai-safety", "security",
    "policy", "opa", "audit", "llm", "guardrails",
]
# Development Status 3 (Alpha), not 4 (Beta): this is the first published release and the API
# has never been depended on from outside this repo. A large test suite is not the same as a
# proven interface, and this classifier is what an adopter reads to decide how much to trust
# the version number.
# No "License :: OSI Approved" classifier: PEP 639 forbids pairing one with a `license`
# expression. No "Typing :: Typed" either -- there is no py.typed marker, so it would claim
# something not actually shipped.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "agentos-guard-contract==0.1.0",
    "agentos-guard-pipeline==0.1.0",
    # SDK-05 zero-infra quickstart wires the control plane + constitution compiler end to end.
    "agentos-guard-controlplane==0.1.0",
    "agentos-guard-constitution==0.1.0",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    # A CONSTRAINT, not something we import. langsmith 0.11.x dropped
    # `_openapi_client.types.annotation_queue_retrieve_annotation_queues_params`, which
    # langchain-core 1.6.0 imports, and langchain-core asks only for `langsmith<1,>=0.3.45`
    # — so a fresh resolve picks the newest of each and `import langchain` raises ImportError
    # before any of our code runs. Verified 2026-08-26: 1.6.0 + 0.11.1 fails, 1.6.0 + 0.10.18
    # imports cleanly. Our lockfile hid this; adopters resolving from scratch would not be so
    # lucky, which is the whole point of testing the install rather than the repo.
    # REMOVE THIS once upstream republishes a compatible pair.
    "langsmith!=0.11.0,!=0.11.1",
    "httpx>=0.27",
]

[project.scripts]
agentos-quickstart = "agentos_sdk.quickstart:main"

[project.urls]
Homepage = "https://github.com/JitendraJha98/agentos-guard"
Repository = "https://github.com/JitendraJha98/agentos-guard"
Issues = "https://github.com/JitendraJha98/agentos-guard/issues"
Documentation = "https://github.com/JitendraJha98/agentos-guard/tree/main/docs/architecture"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos_sdk"]
