{% extends "base.html" %}
{% block body %}
<h2>pending approvals</h2>
<table border="1">
  <thead>
    <tr><th>id</th><th>agent_id</th><th>action_type</th><th>target</th>
        <th>risk</th><th>trust</th><th>resolve</th></tr>
  </thead>
  <tbody>
    {% for a in approvals %}
    <tr>
      <td>{{ a.id }}</td>
      <td>{{ a.agent_id }}</td>
      <td>{{ a.action_type }}</td>
      <td>{{ a.target }}</td>
      <td>{{ a.risk_score }}</td>
      <td>{{ a.trust_score }}</td>
      <td>
        <form method="post" action="/dashboard/approvals/{{ a.id }}/resolve" style="display:inline">
          <input type="hidden" name="decision" value="approve">
          <button type="submit">approve</button>
        </form>
        <form method="post" action="/dashboard/approvals/{{ a.id }}/resolve" style="display:inline">
          <input type="hidden" name="decision" value="deny">
          <button type="submit">deny</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="7">no pending approvals</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
