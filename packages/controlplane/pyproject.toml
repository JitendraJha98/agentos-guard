[project]
name = "agentos-controlplane"
version = "0.1.0"
description = "Control-plane persistence: agent registry, EdDSA identity engine (IDN-01), and the hash-chained fail-closed audit writer (AUD-01) behind a pluggable Store interface. Phase-1 backend is SQLite (D-14 no-Docker deviation); SQLAlchemy/Alembic models are authored for Postgres as the production target."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentos-contract",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.18",
    "PyJWT>=2.13",
    "cryptography>=48",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos_controlplane"]
