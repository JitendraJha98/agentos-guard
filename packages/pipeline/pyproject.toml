[project]
name = "agentos-pipeline"
version = "0.1.0"
description = "The 4-stage decision pipeline. Phase-1 ships the SEC-01 risk stage: the deterministic, inline, ReDoS-safe PromptInjectionScorer + normalize() de-obfuscator + assess_risk aggregator. stdlib re/unicodedata/base64 + Pydantic only — NO LLM/model/network on the hot path (P0-killer)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentos-contract",
    "opa-wasmtime>=0.1.1,<0.2",
    "wasmtime>=27",
    "opentelemetry-api>=1.42",
    "opentelemetry-sdk>=1.42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos_pipeline"]
