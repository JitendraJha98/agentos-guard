# Alembic config for the agentos-controlplane store.
#
# The migration is authored against PostgreSQL as the production target
# (D-14). Alembic runs with a SYNC driver/URL. The Phase-1 SQLite Store does
# not run this migration in tests (it bootstraps via Base.metadata.create_all);
# the migration's Postgres-only append-only trigger is guarded by a dialect
# check and validated against real Postgres in Phase 4/5 per the Deviation Log.

[alembic]
script_location = packages/controlplane/src/agentos_controlplane/store/migrations
prepend_sys_path = .

# Production target: Postgres (sync psycopg URL). Overridden by AGENTOS_DB_URL
# in env.py at runtime. SQLite is the active Phase-1 backend.
sqlalchemy.url = postgresql+psycopg://agentos:agentos@localhost:5432/agentos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
